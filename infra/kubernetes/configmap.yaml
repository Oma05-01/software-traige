apiVersion: v1
kind: ConfigMap
metadata:
  name: software-triage-config
  namespace: software-triage
data:
  DEBUG: "false"

  ALLOWED_HOSTS: "localhost,127.0.0.1,backend,backend.software-triage.svc.cluster.local"

  CSRF_TRUSTED_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"

  DB_HOST: "postgres"
  DB_PORT: "5432"

  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_TASK_ALWAYS_EAGER: "false"